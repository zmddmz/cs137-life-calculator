<!DOCTYPE html>
<html>
<head>
<title>Cs137 Life Calculator</title>
 <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11 Life Calculator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.df.min.jsscript>
</head>
<body>

<h1>Cs137 Source Calculator</h1>

  <hr>

<h2>Drop Certificate PDF</h2>

<input type="file" id="pdfFile">

<button onclick="analyzePDF()">
Analyze Certificate
</button>

<hr>

Original Activity (nCi):
<input id="activity" value="230"><br><br>

Reference Year:
<input id="year" value="2018"><br><br>

Original Count:
<input id="count" value="99"><br><br>

Limit Count:
<input id="limit" value="80"><br><br>

<button onclick="calc()">Calculate</button>

<h2 id="result"></h2>

<script>

function calc(){

let activity=parseFloat(
document.getElementById("activity").value
);

let year=parseFloat(
document.getElementById("year").value
);

let count=parseFloat(
document.getElementById("count").value
);

let limit=parseFloat(
document.getElementById("limit").value
);

let halfLife=30.17;

let currentYear=new Date().getFullYear();

let years=currentYear-year;

let currentActivity=
activity*Math.pow(0.5,years/halfLife);

let currentCount=
count*(currentActivity/activity);

let remaining=
halfLife*
Math.log(limit/currentCount)/
Math.log(0.5);

document.getElementById("result").innerHTML=
`
Current Activity:
${currentActivity.toFixed(1)} nCi<br>

Current Count:
${currentCount.toFixed(1)} cps<br>

Years Remaining:
${remaining.toFixed(2)} years
`;

}

async function analyzePDF() {

const file =
document.getElementById("pdfFile").files[0];

if(!file){
alert("Please select a PDF");
return;
}

const buffer =
await file.arrayBuffer();

const pdf =
await pdfjsLib.getDocument({
data: buffer
}).promise;

let text="";

for(let i=1;i<=pdf.numPages;i++){

const page =
await pdf.getPage(i);

const content =
await page.getTextContent();

text += content.items
.map(item => item.str)
.join(" ");

}

extractData(text);

}
function extractData(text){

console.log(text);

let activityMatch =
text.match(/(\d+)\s*nCi/i);

let dateMatch =
text.match(/\d{4}-\d{2}-\d{2}/);

if(!activityMatch){

alert("Activity not found");

return;

}

let activity =
parseFloat(activityMatch[1]);

let year =
new Date(dateMatch[0]).getFullYear();

alert("Activity Found: " + activity);
8
alert("Year Found: " + year);

document.getElementById("activity").value =
activity;

document.getElementById("year").value =
year;

calc();

}
</script>

</body>
</html>
