<script>

// Constants
const CS137_HALF_LIFE = 30.17; // years
const DETECTOR_DRIFT_PER_YEAR = 0.002;
// Set up PDF.js worker
pdfjsLib.GlobalWorkerOptions.workerSrc = 
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.4/pdf.worker.min.js';

// Drag and drop handlers
const dropzone = document.getElementById('dropzone');

function handleDragOver(event) {
  event.preventDefault();
  event.stopPropagation();
  dropzone.classList.add('active');
}

function handleDragLeave(event) {
  event.preventDefault();
  event.stopPropagation();
  dropzone.classList.remove('active');
}

function handleDrop(event) {
  event.preventDefault();
  event.stopPropagation();
  dropzone.classList.remove('active');
  
  const files = event.dataTransfer.files;
  if (files.length > 0) {
    document.getElementById('pdfFile').files = files;
    analyzePDF();
  }
}

dropzone.addEventListener('click', () => {
  document.getElementById('pdfFile').click();
});

document.getElementById('pdfFile').addEventListener('change', analyzePDF);

// Utility Functions
function showMessage(message, type = 'info', targetId = 'pdfMessage') {
  const msgDiv = document.getElementById(targetId);
  msgDiv.className = `message show ${type}`;
  msgDiv.textContent = message;
  setTimeout(() => msgDiv.classList.remove('show'), 5000);
}

function showResultMessage(message, type = 'info') {
  showMessage(message, type, 'resultMessage');
}

function validateDate(dateString) {
  const regex = /^\d{4}-\d{2}-\d{2}$/;
  if (!regex.test(dateString)) return false;
  const date = new Date(dateString);
  return date instanceof Date && !isNaN(date);
}

function parseDate(dateString) {
  return new Date(dateString);
}

function formatDate(date) {
  return date.toISOString().split('T')[0];
}

// PDF Extraction
async function analyzePDF() {
  const file = document.getElementById('pdfFile').files[0];

  if (!file) {
    return;
  }

  if (!file.type.includes('pdf')) {
    showMessage('Please select a valid PDF file.', 'error');
    return;
  }

  try {
    showMessage('Processing PDF...', 'info');

    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

    let fullText = '';

    // Extract text from all pages
    for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
      const page = await pdf.getPage(pageNum);
      const textContent = await page.getTextContent();
      const pageText = textContent.items
        .map(item => item.str)
        .join(' ');
      fullText += pageText + ' ';
    }

    extractCertificateData(fullText);
    
    const pdfInfo = document.getElementById('pdfInfo');
    pdfInfo.innerHTML = `✓ PDF loaded: ${file.name} (${pdf.numPages} page${pdf.numPages > 1 ? 's' : ''})`;
    pdfInfo.style.display = 'block';
    
    showMessage('PDF processed successfully! Fields auto-filled from certificate.', 'success');

  } catch (error) {
    showMessage(`Error reading PDF: ${error.message}`, 'error');
    console.error(error);
  }
}

function extractCertificateData(text) {
  // Extract Source Serial Number
  function extractCertificateData(text)
{
    text = text.replace(/\s+/g, " ");

    const sourcePatterns =
    [
        /source\s*(?:serial|s\/n|sn|id|number|no\.?)[:\s]+([A-Z0-9\-]+)/i,
        /radioactive\s*source[:\s]+([A-Z0-9\-]+)/i
    ];

    for(const pattern of sourcePatterns)
    {
        const match = text.match(pattern);

        if(match)
        {
            document.getElementById(
                "sourceSerial"
            ).value = match[1];

            break;
        }
    }

    const detectorPatterns =
    [
        /detector\s*(?:serial|s\/n|sn|id|number|no\.?)[:\s]+([A-Z0-9\-]+)/i,
        /probe\s*(?:serial|id)?[:\s]+([A-Z0-9\-]+)/i
    ];

    for(const pattern of detectorPatterns)
    {
        const match = text.match(pattern);

        if(match)
        {
            document.getElementById(
                "detectorSerial"
            ).value = match[1];

            break;
        }
    }

    const activityMatch =
        text.match(
        /(\d+(?:\.\d+)?(?:E[+-]?\d+)?)\s*(?:nCi|nano\s*curies?)/i
        );

    if(activityMatch)
    {
        document.getElementById(
            "activity"
        ).value =
        parseFloat(activityMatch[1]).toFixed(2);
    }

    const datePatterns =
    [
        /\d{4}-\d{2}-\d{2}/,
        /\d{2}-[A-Za-z]{3}-\d{4}/,
        /[A-Za-z]{3,9}\s+\d{1,2},\s+\d{4}/,
        /\d{2}\/\d{2}\/\d{4}/
    ];

    for(const pattern of datePatterns)
    {
        const match = text.match(pattern);

        if(match)
        {
            document.getElementById(
                "referenceDate"
            ).value = new Date(match[0])
                .toISOString()
                .split("T")[0];

            break;
        }
    }

    const ambientMatch =
        text.match(
        /(?:ambient|room)\s*(?:temperature|temp)?[:\s]+(-?\d+(?:\.\d+)?)\s*°?\s*C/i
        );

    if(ambientMatch)
    {
        document.getElementById(
            "ambientTemp"
        ).value =
        parseFloat(ambientMatch[1]).toFixed(1);
    }

    const highMatch =
        text.match(
        /(?:high|elevated|max(?:imum)?|operating)\s*(?:temperature|temp)?[:\s]+(-?\d+(?:\.\d+)?)\s*°?\s*C/i
        );

    if(highMatch)
    {
        document.getElementById(
            "elevatedTemp"
        ).value =
        parseFloat(highMatch[1]).toFixed(1);
    }

    const countPatterns =
    [
        /source\s*count[:\s]+(\d+(?:\.\d+)?)\s*cps/i,
        /calibration\s*count[:\s]+(\d+(?:\.\d+)?)\s*cps/i,
        /count\s*rate[:\s]+(\d+(?:\.\d+)?)\s*cps/i,
        /high\s*temp.*?(\d+(?:\.\d+)?)\s*cps/i
    ];

    for(const pattern of countPatterns)
    {
        const match = text.match(pattern);

        if(match)
        {
            document.getElementById(
                "originalCount"
            ).value =
            parseFloat(match[1]).toFixed(1);

            break;
        }
    }
}

function calculate() {

  const activity = parseFloat(document.getElementById('activity').value);
  const referenceDate = document.getElementById('referenceDate').value.trim();
  const originalCount = parseFloat(document.getElementById('originalCount').value);
  const lowLimit = parseFloat(document.getElementById('lowLimit').value);
  const highLimit = parseFloat(document.getElementById('highLimit').value);

  // Validation
generateTrendGraph(

``

  try {

let trendChart = null;

function generateTrendGraph(
    originalCount,
    lowLimit,
    highLimit
)
{
    const labels = [];
    const values = [];

    for(let year=0; year<=40; year++)
    {
        labels.push(year);

        values.push(
            originalCount *
            Math.pow(
                0.5,
                year / CS137_HALF_LIFE
            )
        );
    }

    const ctx =
        document
        .getElementById("trendChart")
        .getContext("2d");

    if(trendChart)
    {
        trendChart.destroy();
    }

    trendChart =
        new Chart(ctx,{
            type:"line",

            data:{
                labels:labels,

                datasets:[
                {
                    label:
                    "Predicted Count",

                    data:values,

                    borderColor:"#667eea",

                    tension:0.3
                },
                {
                    label:"High Limit",

                    data:new Array(
                        labels.length
                    ).fill(highLimit),

                    borderColor:"#ff9800",

                    borderDash:[5,5]
                },
                {
                    label:"Low Limit",

                    data:new Array(
                        labels.length
                    ).fill(lowLimit),

                    borderColor:"#dc3545",

                    borderDash:[5,5]
                }]
            }
        });
}
